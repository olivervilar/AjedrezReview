<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analizador de Ajedrez con IA Gemini</title>
  <!-- Chessboard.js & Chess.js CDN -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e24;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 20px; color: #4caf50; }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }
    .panel-left {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #board {
      width: 450px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 15px;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #555; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .panel-right {
      flex: 1;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.9em; color: #aaa; }
    input[type="text"], input[type="password"] {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #2a2a32;
      color: #fff;
    }
    .analysis-box {
      background-color: #2a2a32;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 15px;
      flex: 1;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.5;
      font-size: 0.95em;
      white-space: pre-wrap;
    }
    .status-badge {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85em;
      margin-top: 5px;
    }
    .error { background-color: #5a1e1e; color: #ff9999; border: 1px solid #993333; }
    .success { background-color: #1e5a22; color: #99ff99; border: 1px solid #339933; }
    .info { background-color: #1e3a5a; color: #99ccff; border: 1px solid #336699; }
  </style>
</head>
<body>

  <h1>Analizador de Partidas Lichess + IA Gemini</h1>

  <div class="container">
    <div class="panel-left">
      <div id="board"></div>
      <div class="controls">
        <button id="btnStart">⏮ Inicio</button>
        <button id="btnPrev">◀ Anterior</button>
        <button id="btnNext">Siguiente ▶</button>
        <button id="btnEnd">Final ⏭</button>
      </div>
    </div>

    <div class="panel-right">
      <div class="input-group">
        <label for="lichessId">ID de la Partida en Lichess (Ejemplo: <code>q72d2424</code>)</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="lichessId" placeholder="Introduce el ID de Lichess" style="flex: 1;">
          <button id="btnCargar">Cargar Partida</button>
        </div>
      </div>

      <div class="input-group">
        <label for="apiKey">Clave API de Gemini (Empieza con AIzaSy...)</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
      </div>

      <button id="btnExplicar" style="background-color: #2e7d32;" disabled>🤖 Explicar Jugada Actual con IA</button>

      <div id="statusMessage" class="status-badge info">Estado: Listo. Carga una partida de Lichess para comenzar.</div>

      <div class="analysis-box" id="analysisOutput">Aquí aparecerá el análisis de la IA para la jugada actual...</div>
    </div>
  </div>

  <script>
    let game = new Chess();
    let board = null;
    let movesHistory = [];
    let currentMoveIndex = -1;

    // Inicializar Tablero
    board = Chessboard('board', {
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    function setStatus(msg, type = 'info') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.textContent = msg;
      statusEl.className = `status-badge ${type}`;
    }

    // 1. CARGAR PARTIDA DE LICHESS CON FALLBACK
    document.getElementById('btnCargar').addEventListener('click', async () => {
      const rawInput = document.getElementById('lichessId').value.trim();
      if (!rawInput) {
        setStatus('Por favor introduce un ID o enlace de Lichess.', 'error');
        return;
      }

      // Extraer ID si pegaron la URL completa
      const gameId = rawInput.replace('https://lichess.org/', '').split('/')[0].split('#')[0];

      setStatus(`Cargando partida ${gameId} desde Lichess...`, 'info');

      let pgnData = null;

      // Intento 1: Petición directa a la API de Lichess (Soporta CORS)
      try {
        const res = await fetch(`https://lichess.org/game/export/${gameId}?evals=true&clocks=false`);
        if (res.ok) {
          pgnData = await res.text();
        }
      } catch (err) {
        console.warn('Petición directa a Lichess falló, intentando con proxy...', err);
      }

      // Intento 2: Proxy de respaldo en caso de fallo
      if (!pgnData) {
        try {
          const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(`https://lichess.org/game/export/${gameId}?evals=true`)}`;
          const res = await fetch(proxyUrl);
          if (res.ok) {
            pgnData = await res.text();
          }
        } catch (err) {
          console.error('Error en el proxy:', err);
        }
      }

      if (!pgnData) {
        setStatus('Error al obtener la partida de Lichess. Verifica el ID o tu conexión a Internet.', 'error');
        return;
      }

      // Cargar PGN en Chess.js
      game.reset();
      const loaded = game.load_pgn(pgnData);
      if (!loaded) {
        setStatus('El PGN obtenido no se pudo procesar correctamente.', 'error');
        return;
      }

      movesHistory = game.history({ verbose: true });
      game.reset();
      board.position(game.fen());
      currentMoveIndex = -1;

      setStatus(`Partida cargada exitosamente. Total de jugadas: ${movesHistory.length}`, 'success');
      document.getElementById('btnExplicar').disabled = false;
    });

    // NAUFRAGIO Y NAVEGACIÓN
    function updatePosition(index) {
      game.reset();
      for (let i = 0; i <= index; i++) {
        game.move(movesHistory[i]);
      }
      currentMoveIndex = index;
      board.position(game.fen());
    }

    document.getElementById('btnStart').addEventListener('click', () => {
      game.reset();
      currentMoveIndex = -1;
      board.position(game.fen());
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      if (currentMoveIndex > 0) {
        updatePosition(currentMoveIndex - 1);
      } else if (currentMoveIndex === 0) {
        game.reset();
        currentMoveIndex = -1;
        board.position(game.fen());
      }
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      if (currentMoveIndex < movesHistory.length - 1) {
        updatePosition(currentMoveIndex + 1);
      }
    });

    document.getElementById('btnEnd').addEventListener('click', () => {
      if (movesHistory.length > 0) {
        updatePosition(movesHistory.length - 1);
      }
    });

    // 2. EXPLICAR JUGADA CON IA GEMINI (CON MANEJO DE ERRORES DE RED)
    document.getElementById('btnExplicar').addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      const outputEl = document.getElementById('analysisOutput');

      if (!apiKey) {
        setStatus('Ingresa tu clave API de Google Gemini.', 'error');
        return;
      }

      if (currentMoveIndex < 0) {
        outputEl.textContent = 'Avanza al menos un movimiento para analizar la jugada.';
        return;
      }

      const move = movesHistory[currentMoveIndex];
      const fenAntes = (currentMoveIndex > 0) ? movesHistory[currentMoveIndex - 1].fen : 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
      const fenDespues = move.fen;

      outputEl.textContent = '🤖 Analizando la posición con la IA... Por favor espera.';
      setStatus('Enviando consulta a Gemini...', 'info');

      const promptText = `Eres un Gran Maestro de Ajedrez. Analiza la siguiente jugada:
- Posición previa (FEN): ${fenAntes}
- Jugada realizada: ${move.color === 'w' ? 'Blancas' : 'Negras'} jugaron ${move.san} (de ${move.from} a ${move.to}).
- Posición resultante (FEN): ${fenDespues}

Por favor explica de forma didáctica:
1. ¿Cuál es el propósito o la idea táctica/posicional detrás de esta jugada (${move.san})?
2. ¿Qué piezas quedan amenazadas o defendidas?
3. Breve recomendación para el oponente en la siguiente jugada.`;

      // Modelo recomendado
      const modelo = 'gemini-1.5-flash';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        // Manejar respuestas con errores de API (400, 403, 429, etc.)
        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          const detail = errBody.error ? errBody.error.message : response.statusText;
          throw new Error(`Error API (${response.status}): ${detail}`);
        }

        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
          outputEl.textContent = text;
          setStatus('Análisis generado correctamente.', 'success');
        } else {
          outputEl.textContent = 'La respuesta de la IA no contiene texto válido.';
          setStatus('Respuesta vacía recibida.', 'error');
        }

      } catch (err) {
        console.error('Error detallado:', err);

        // Diagnóstico preciso del error
        if (err.name === 'TypeError' && err.message.includes('fetch')) {
          outputEl.textContent = `❌ ERROR DE RED ("Failed to fetch"):
No se pudo conectar con los servidores de Google Gemini.

Causas frecuentes:
1. Tienes un bloqueador de anuncios (uBlock / AdBlock / Escudo de Brave) activo que bloquea la API de Google.
2. Tu clave de API no tiene un formato válido (debe empezar con "AIzaSy...").
3. Hay un problema temporal con tu conexión a Internet.`;
          setStatus('Fallo de red o API bloqueada por el navegador.', 'error');
        } else {
          outputEl.textContent = `❌ ${err.message}`;
          setStatus('Error en la llamada a la API.', 'error');
        }
      }
    });
  </script>
</body>
</html>
